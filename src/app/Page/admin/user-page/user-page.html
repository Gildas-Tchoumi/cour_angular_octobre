<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-lg rounded-xl bg-white p-8 shadow-xl">
        <h2 class="mb-6 text-center text-3xl font-bold text-gray-800">
            Contactez-nous
        </h2>

        <form class="space-y-5">

            <!-- Nom -->
            <div>
                <label for="nom" class="mb-2 block text-sm font-semibold text-gray-700">
                    Nom
                </label>
                <input id="nom" type="text" [(ngModel)]="nom" name="nom" placeholder="Entrez votre nom"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="mb-2 block text-sm font-semibold text-gray-700">
                    Email
                </label>
                <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="exemple@email.com"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
            </div>

            <!-- Avis -->
            <div>
                <label for="avis" class="mb-2 block text-sm font-semibold text-gray-700">
                    Votre avis
                </label>
                <textarea id="avis" rows="5" [(ngModel)]="avis" name="avis" placeholder="Écrivez votre avis..."
                    class="w-full resize-none rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"></textarea>
            </div>

            <!-- Bouton -->
            <button type="submit" (click)="onSubmit()"
                class="w-full rounded-lg bg-blue-600 px-6 py-3 text-lg font-semibold text-white shadow-md transition duration-300 hover:bg-blue-700 hover:shadow-lg active:scale-95">
                Soumettre
            </button>

        </form>
    </div>
    <p>{{nom}}</p>
</div>
