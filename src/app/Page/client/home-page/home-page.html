<section class="py-4">
    <div class="container  mx-auto px-4">
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
            @for(item of products; track item.id) {
                @if($odd) {
                    <div class="border border-transparent hover:border-red-500 transition-colors duration-300">
                        <app-product-card [prod]="item" />
                    </div>
                }@else {
                    <app-product-card [prod]="item" />
                }
            } @empty {
                <p>Aucun produits trouve</p>
            }

            <app-counter (countEvent)="ListenerCountEvent($event)"/>
            <h1 class="text-5xl font-bold text-gray-800">
                {{countnumb}}
            </h1>
        
        </div>
    </div>
</section>
