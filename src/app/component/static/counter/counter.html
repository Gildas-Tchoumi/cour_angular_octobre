
<div class="mx-auto w-full max-w-sm rounded-xl bg-white p-6 shadow-lg border border-gray-200 mb-4">
    <!-- Compteur -->
    <div class="mb-6 text-center">
        <h1 class="text-5xl font-bold text-gray-800">
            {{count}}
        </h1>
        <p class="mt-2 text-sm text-gray-500">
            Valeur du compteur
        </p>
    </div>

    <!-- Boutons -->
    <div class="flex items-center justify-center gap-4">
        <!-- Incrément -->
        <button type="button" (click)="increment()"
            class="rounded-lg bg-green-500 px-5 py-3 text-xl font-semibold text-white shadow-md transition-all duration-300 hover:bg-green-600 hover:scale-105 active:scale-95">
            + 👆
        </button>

        <!-- Réinitialiser -->
        <button type="button"  (click)="reset()"
            class="rounded-lg bg-blue-500 px-5 py-3 text-xl font-semibold text-white shadow-md transition-all duration-300 hover:bg-blue-600 hover:scale-105 active:scale-95">
            👌
        </button>

        <!-- Décrément -->
        <button type="button" (click)="decrement()"
            class="rounded-lg bg-red-500 px-5 py-3 text-xl font-semibold text-white shadow-md transition-all duration-300 hover:bg-red-600 hover:scale-105 active:scale-95">
            - 👇
        </button>

    </div>
</div>
